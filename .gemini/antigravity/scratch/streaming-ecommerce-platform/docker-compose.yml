version: '3.8'

networks:
  ecommerce-net:
    driver: bridge

volumes:
  minio-data:
  postgres-dw-data:
  airflow-db-data:

services:
  # ============================================================================
  # 1. KAFKA (KRaft Mode) & KAFKA-UI
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ============================================================================
  # 2. MINIO (S3-Compatible Object Storage Data Lake)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/ecommerce-lake;
      /usr/bin/mc anonymous set download myminio/ecommerce-lake;
      exit 0;
      "
    networks:
      - ecommerce-net

  # ============================================================================
  # 3. POSTGRESQL DATA WAREHOUSE & AIRFLOW METADATA DB
  # ============================================================================
  postgres-dw:
    image: postgres:16-alpine
    container_name: postgres-dw
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
      - ./sql/01_init_warehouse.sql:/docker-entrypoint-initdb.d/01_init_warehouse.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_dw"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ============================================================================
  # 4. APACHE SPARK (Master & Worker)
  # ============================================================================
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"
      - "7077:7077"
    networks:
      - ecommerce-net

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    networks:
      - ecommerce-net

  # ============================================================================
  # 5. PYTHON FAKER PRODUCER SERVICE
  # ============================================================================
  producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: ecommerce-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCER_EMIT_RATE_HZ: "3.0"
      SIMULATION_MAX_CUSTOMERS: "500"
      SIMULATION_MAX_PRODUCTS: "80"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-net
    restart: on-failure

  # ============================================================================
  # 6. SPARK STRUCTURED STREAMING PIPELINE
  # ============================================================================
  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-streaming-job
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-lake
    volumes:
      - ./spark:/app/spark
    command: >
      /opt/bitnami/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      /app/spark/streaming_pipeline.py
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      spark-master:
        condition: service_started
    networks:
      - ecommerce-net
    restart: on-failure

  # ============================================================================
  # 7. APACHE AIRFLOW ORCHESTRATION (Init, Webserver, Scheduler)
  # ============================================================================
  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/ecommerce_dw
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version
    depends_on:
      postgres-dw:
        condition: service_healthy
    networks:
      - ecommerce-net

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-webserver
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/ecommerce_dw
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres-dw
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_ecommerce:/opt/airflow/dbt_ecommerce
      - ./spark:/opt/airflow/spark
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ecommerce-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-scheduler
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres-dw:5432/ecommerce_dw
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres-dw
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_ecommerce:/opt/airflow/dbt_ecommerce
      - ./spark:/opt/airflow/spark
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ecommerce-net

  # ============================================================================
  # 8. STREAMLIT EXECUTIVE DASHBOARD
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ecommerce-dashboard
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres-dw
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres-dw:
        condition: service_healthy
    networks:
      - ecommerce-net
