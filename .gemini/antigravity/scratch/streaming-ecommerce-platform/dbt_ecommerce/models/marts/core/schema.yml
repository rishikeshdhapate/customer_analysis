version: 2

models:
  - name: dim_customers
    description: "Customer dimension table"
    columns:
      - name: customer_key
        description: "Surrogate primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural customer business identifier"
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Product catalog dimension table"
    columns:
      - name: product_key
        description: "Surrogate primary key"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Natural product SKU"
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null

  - name: dim_date
    description: "Calendar date dimension"
    columns:
      - name: date_key
        description: "Integer date key (YYYYMMDD)"
        tests:
          - unique
          - not_null
      - name: date
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Central e-commerce orders fact table"
    columns:
      - name: order_id
        description: "Primary key for orders fact"
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        description: "Foreign key to dim_products"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: date_key
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: quantity
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null

  - name: fct_clickstream
    description: "Clickstream events fact table"
    columns:
      - name: event_id
        description: "Primary key for click events"
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['view', 'add_to_cart', 'checkout']
